="#818cf8" class="badge-text" text-anchor="middle">⚖️ Denied-Party Screening</text></g><g transform="translate(60, 0) translate(0, 205) translate(330, 0)"><rect width="145" height="30" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="72" y="19" fill="#c084fc" class="badge-text" text-anchor="middle">📦 Supply Chain GTM</text></g><g transform="translate(60, 0) translate(0, 205) translate(485, 0)"><rect width="140" height="30" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="70" y="19" fill="#34d399" class="badge-text" text-anchor="middle">⭐ Open Source</text></g></g></g></svg>