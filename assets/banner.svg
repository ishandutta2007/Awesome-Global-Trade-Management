<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 46px;
      font-weight: 800;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 500;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .grid-line {
      stroke: #334155;
      stroke-opacity: 0.3;
      stroke-dasharray: 4 4;
    }
    .flow-line {
      fill: none;
      stroke: #38bdf8;
      stroke-width: 2;
      stroke-dasharray: 10 200;
      animation: flow 4s linear infinite;
    }
    @keyframes flow {
      0% { stroke-dashoffset: 210; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }
    .pulse-circle {
      transform-origin: 1000px 150px;
      animation: pulse 6s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid -->
  <line x1="100" y1="0" x2="100" y2="300" class="grid-line" />
  <line x1="300" y1="0" x2="300" y2="300" class="grid-line" />
  <line x1="500" y1="0" x2="500" y2="300" class="grid-line" />
  <line x1="700" y1="0" x2="700" y2="300" class="grid-line" />
  <line x1="900" y1="0" x2="900" y2="300" class="grid-line" />
  <line x1="1100" y1="0" x2="1100" y2="300" class="grid-line" />
  <line x1="0" y1="75" x2="1200" y2="75" class="grid-line" />
  <line x1="0" y1="150" x2="1200" y2="150" class="grid-line" />
  <line x1="0" y1="225" x2="1200" y2="225" class="grid-line" />

  <!-- Dynamic Animated Globe & Logistics Elements (Background / Right Side) -->
  <g class="pulse-circle" opacity="0.6">
    <circle cx="1000" cy="150" r="110" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 6" />
    <circle cx="1000" cy="150" r="80" fill="none" stroke="#64748b" stroke-width="1" />
    <ellipse cx="1000" cy="150" rx="110" ry="40" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
    <ellipse cx="1000" cy="150" rx="40" ry="110" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.5" />
  </g>

  <!-- Flow lines representing global supply chain routes -->
  <path d="M 600,220 Q 800,100 1000,150" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" />
  <path d="M 600,220 Q 800,100 1000,150" class="flow-line" />
  
  <path d="M 700,260 Q 900,180 1100,110" fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.3" />

  <!-- Container / Logistics Nodes -->
  <circle cx="1000" cy="150" r="6" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="850" cy="130" r="4" fill="#818cf8" />
  <circle cx="720" cy="190" r="5" fill="#c084fc" />

  <!-- Foreground Content (Title, Subtitle, Tags) -->
  <g transform="translate(60, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 50)">
      <rect width="260" height="28" rx="14" fill="url(#accentGrad)" />
      <text x="130" y="18" text-anchor="middle" class="badge-text">🌐 GLOBAL TRADE &amp; COMPLIANCE</text>
    </g>

    <!-- Title -->
    <text x="0" y="130" class="title" filter="url(#glow)">Awesome Global Trade Management</text>

    <!-- Subtitle -->
    <text x="0" y="172" class="subtitle">Curated SaaS Platforms, Trade Compliance Tools &amp; Open-Source Ecosystem</text>

    <!-- Feature Chips -->
    <g transform="translate(0, 205)">
      <!-- Chip 1 -->
      <g transform="translate(0, 0)">
        <rect width="145" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="72" y="19" text-anchor="middle" class="badge-text" fill="#38bdf8">🛃 Customs &amp; Tariffs</text>
      </g>
      <!-- Chip 2 -->
      <g transform="translate(155, 0)">
        <rect width="165" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="82" y="19" text-anchor="middle" class="badge-text" fill="#818cf8">⚖️ Denied-Party Screening</text>
      </g>
      <!-- Chip 3 -->
      <g transform="translate(330, 0)">
        <rect width="145" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="72" y="19" text-anchor="middle" class="badge-text" fill="#c084fc">📦 Supply Chain GTM</text>
      </g>
      <!-- Chip 4 -->
      <g transform="translate(485, 0)">
        <rect width="140" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="70" y="19" text-anchor="middle" class="badge-text" fill="#34d399">⭐ Open Source</text>
      </g>
    </g>
  </g>
</svg>
