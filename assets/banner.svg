<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#0ea5e9" stop-opacity=".8"/><stop offset="100%" stop-color="#6366f1" stop-opacity=".8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes flow{0%{stroke-dashoffset:210}}@keyframes pulse{0%{transform:scale(1);opacity:.4}50%{transform:scale(1.05);opacity:.8}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-size:46px;font-weight:800;fill:url(#textGrad)}.subtitle{font-size:20px;font-weight:500;fill:#94a3b8}.badge-text{font-size:13px;font-weight:600;fill:#e2e8f0}.grid-line{stroke:#334155;stroke-opacity:.3;stroke-dasharray:4 4}.flow-line{fill:none;stroke:#38bdf8;stroke-width:2;stroke-dasharray:10 200;animation:flow 4s linear infinite}.pulse-circle{transform-origin:1000px 150px;animation:pulse 6s ease-in-out infinite}</style><rect width="1200" height="300" fill="url(#bgGrad)" rx="16"/><line x1="100" x2="100" y1="0" y2="300" class="grid-line"/><line x1="300" x2="300" y1="0" y2="300" class="grid-line"/><line x1="500" x2="500" y1="0" y2="300" class="grid-line"/><line x1="700" x2="700" y1="0" y2="300" class="grid-line"/><line x1="900" x2="900" y1="0" y2="300" class="grid-line"/><line x1="1100" x2="1100" y1="0" y2="300" class="grid-line"/>